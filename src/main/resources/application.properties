spring.application.name=resume-ats-job-matcher

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/ats_matcher
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- File upload limits (resumes are small, cap generously) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Gemini API ---
# Get a key at https://aistudio.google.com/apikey (free tier available).
# Never commit the real key, set it as an environment variable.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent

# --- Adzuna job search API ---
# Free tier credentials at https://developer.adzuna.com
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
adzuna.country=in

server.port=8081
